allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Skip unit tests to avoid "different roots" error on Windows (Drive C vs D)
    gradle.startParameter.excludedTaskNames.addAll([
        'generateDebugUnitTestConfig', 
        'testDebugUnitTest', 
        'testReleaseUnitTest'
    ])
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    // Hack: Provide 'flutter' property for older plugins (wakelock_plus, etc.)
    // that expect it to be present in the project scope.
    ext.flutter = [
        minSdkVersion: 28,
        compileSdkVersion: 34,
        targetSdkVersion: 34
    ]

    // Fix for 3rd party plugins that explicitly need a namespace
    plugins.withId('com.android.library') {
        android {
            if (namespace == null) {
                namespace project.group
            }
            if (compileSdkVersion == null) {
                compileSdkVersion 34
            }
        }
    }
}



tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
